# Render Blueprint — deploy the entire Ringside stack in one click
# https://render.com/docs/blueprint-spec

databases:
  - name: ringside-db
    plan: free
    databaseName: ringside
    user: ringside

services:
  - type: web
    name: ringside-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run db:migrate && npm run db:seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ringside-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Push notifications (generate with: npx web-push generate-vapid-keys)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        value: mailto:tom@mccannmd.com
      # Stripe billing (from dashboard.stripe.com)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VITE_STRIPE_PUBLIC_KEY
        sync: false
